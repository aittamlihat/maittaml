    Experience:

      - company: ATLAS Collaboration
        position: PhD Researcher / Lead Analyst
        location:  Mohammed V University in Rabat
        start_date: 2023
        end_date: 2026
        summary: "Experimental high-energy physics research in ultra-peripheral heavy-ion collisions, light-by-light scattering, and searches for physics beyond the Standard Model."
        highlights:
          - "Main analysis contact and lead analyst for an ATLAS Run 3 heavy-ion physics analysis."
          - "Leading the measurement of light-by-light scattering and searches for axion-like particles and massive gravitons."
          - "Developed analysis methods for photon reconstruction, photon identification, and  backgrounds estimation"
          - "Prepared and produced Monte Carlo samples and developed the analysis software framework."
          - "Contributed to detector calibration and performance studies."
          - "Designed and implemented statistical methods to extract constraints on new physics models."
          - "Coordinate analysis activities and lead the preparation of results for ATLAS meetings, conferences, and publications."


      - company: Phenomenology Research
        position: Phenomenology Researcher
        location:  Mohammed V University in Rabat
        start_date: 2023
        end_date: 2026
        summary: "Phenomenological studies of physics beyond the Standard Model using light-by-light scattering."
        highlights:
          - "Main author of two refereed publications on massive gravitons and extra-dimensional excitations."
          - "Proposed research ideas and developed them into phenomenological studies with collaborators."
          - "Implemented theoretical models in Monte Carlo event generators and produced dedicated event samples."
          - "Performed phenomenological analyses and statistical interpretations."
          - "Produced publication-quality figures and contributed to manuscript preparation."


      - company: ATLAS Collaboration
        position: Physics Analyst
        location:  Mohammed V University in Rabat
        start_date: 2022
        end_date: 2023
        summary: "Reinterpretation of an ATLAS search for high-mass resonances in photon plus missing transverse momentum final states."
        highlights:
          - "Developed an analysis workflow to reinterpret existing ATLAS results in additional new physics scenarios."


      - company: ATLAS Collaboration
        position: HGTD Production Database Developer
        location: Mohammed V University in Rabat
        start_date: 2021
        end_date: 2022
        summary: "Development of production database and web tools for the ATLAS High-Granularity Timing Detector (HGTD)"
        highlights:
          - "Developed the initial MySQL production database for HGTD component data."
          - "Developed web-based tools for detector production tracking and data management."


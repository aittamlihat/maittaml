# Sample workflow for building and deploying a Jekyll site to GitHub Pages

name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
# Do not cancel in-progress deployments.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ============================================================
  # BUILD JOB
  # ============================================================
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Install ImageMagick
      # Required by al-folio for image processing
      # --------------------------------------------------------
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      # --------------------------------------------------------
      # Setup Python
      # Required by jekyll-jupyter-notebook
      # --------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # --------------------------------------------------------
      # Install Jupyter and nbconvert
      # Required to convert .ipynb files during the Jekyll build
      # --------------------------------------------------------
      - name: Install Jupyter
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyter nbconvert

      # --------------------------------------------------------
      # Setup Ruby
      # --------------------------------------------------------
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          cache-version: 0

      # --------------------------------------------------------
      # Setup GitHub Pages
      # --------------------------------------------------------
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # --------------------------------------------------------
      # Build Jekyll website
      # --------------------------------------------------------
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # --------------------------------------------------------
      # Upload generated website
      # --------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # ============================================================
  # DEPLOY JOB
  # ============================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      # --------------------------------------------------------
      # Deploy website to GitHub Pages
      # --------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
